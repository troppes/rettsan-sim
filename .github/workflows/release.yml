name: Release

# Ein Tag wie v2.1.0 baut das Spiel, erstellt ein GitHub-Release mit Notizen
# und veröffentlicht genau diese Version auf GitHub Pages.
# Alternativ "Run workflow" auf main: Tag wird aus package.json erzeugt.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag passt zur Version in package.json
        id: tag
        run: |
          v=v$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME passt nicht zu package.json ($v)"; exit 1; }
          elif git ls-remote --exit-code --tags origin "$v" >/dev/null; then
            echo "$v gibt es schon, erst die Version erhöhen (npm version …)"; exit 1
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: ZIP für das Release
        run: cd dist && zip -qr ../rettsan-sim-$TAG.zip .
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" rettsan-sim-$TAG.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" $pre
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !contains(needs.build.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
